<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="60%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" />
  
  <!-- Outer Bezel Ring (Porsche/Chronometer inspired) -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="2" />
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.6" />
  
  <!-- Subtle Gauge Ticks -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5" stroke-dasharray="3 24" />

  <!-- Dual Arcs: Vigilance & Readiness (Duty & Standby) -->
  <!-- Top Arc: Amber Gold (Nöbet) -->
  <path d="M 180 220 A 96 96 0 0 1 332 220" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Bottom Arc: Ice Cyan (İcap) -->
  <path d="M 332 292 A 96 96 0 0 1 180 292" fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Center Chrono Aperture / Luminous Nucleus -->
  <circle cx="256" cy="256" r="28" fill="#0E0E12" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <circle cx="256" cy="256" r="12" fill="url(#goldGrad)" />
  <circle cx="256" cy="256" r="4" fill="#FFFFFF" />
</svg>
